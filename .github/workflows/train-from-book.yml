name: Train From Connect Four Solved Opening Book

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-four-book-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Train on all 4.2 million exact database positions
        run: |
          python scripts/train_from_book.py --model models/connect4_ntuple.npz --output models/candidates/latest.npz --best-output models/candidates/book-pretrained.npz --epochs 3 --learning-rate 0.00002 --seed "$GITHUB_RUN_NUMBER"

      - name: Save candidate and training report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-four-book-trained
          path: |
            models/candidates/book-pretrained.npz
            models/candidates/latest.npz
            book_training_report.json
          if-no-files-found: warn
          retention-days: 90
