name: Build exact Connect Four WebAssembly engine

on:
  push:
    branches:
      - perfect-solver-web
    paths:
      - "perfect_solver.cpp"
      - ".github/workflows/build-perfect-solver-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-four-perfect-solver-wasm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perfect-solver-web

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly module
        run: |
          em++ perfect_solver.cpp \
            -std=c++17 -O3 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=CreateConnect4Solver \
            -s ENVIRONMENT=web,node \
            -s EXPORTED_FUNCTIONS='["_c4_best_move","_c4_score","_c4_analyze","_c4_nodes","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=33554432 \
            -s MAXIMUM_MEMORY=268435456 \
            -o perfect_solver.js

      - name: Commit generated browser engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfect_solver.js perfect_solver.wasm
          git commit -m "Build exact solver WebAssembly module"
          git push origin HEAD:perfect-solver-web
