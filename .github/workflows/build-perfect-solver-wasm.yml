name: Build exact Connect Four WebAssembly engine

on:
  push:
    branches:
      - main
      - perfect-solver-web
    paths:
      - "perfect_solver.cpp"
      - "tests/test_perfect_solver_wasm.js"
      - "tests/test_exact_solver_interface.py"
      - "exact_solver.py"
      - "play_connect4.py"
      - "app.js"
      - "perfect_solver_worker.js"
      - "book-version.json"
      - ".github/workflows/build-perfect-solver-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-four-perfect-solver-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Download exact opening book
        run: |
          curl -L --fail https://github.com/PascalPons/connect4/releases/download/book/7x6_small.book -o 7x6_small.book
          gzip -9 -kf 7x6_small.book
          gzip -t 7x6_small.book.gz
          gzip -dc 7x6_small.book.gz | cmp - 7x6_small.book
          echo "Original book: $(wc -c < 7x6_small.book) bytes"
          echo "Compressed book: $(wc -c < 7x6_small.book.gz) bytes"

      - name: Build WebAssembly module
        run: |
          em++ perfect_solver.cpp \
            -std=c++17 -O3 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=CreateConnect4Solver \
            -s ENVIRONMENT=web,node \
            -s EXPORTED_FUNCTIONS='["_c4_load_book","_c4_best_move","_c4_score","_c4_analyze","_c4_nodes","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","HEAPU8"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=67108864 \
            -s MAXIMUM_MEMORY=268435456 \
            -o perfect_solver.js

      - name: Check browser scripts
        run: |
          node --check app.js
          node --check perfect_solver_worker.js

      - name: Test WebAssembly engine
        run: node tests/test_perfect_solver_wasm.js

      - name: Test native exact solver interface
        run: python tests/test_exact_solver_interface.py

      - name: Commit generated browser engine and compressed book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfect_solver.js perfect_solver.wasm 7x6_small.book 7x6_small.book.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build exact solver WebAssembly module"
          git push origin "HEAD:${GITHUB_REF_NAME}"
