name: Compare Connect Four Book Models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/candidate-comparison.yml'

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download the completed book-training artifact
        uses: actions/download-artifact@v4
        with:
          name: connect-four-book-trained
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42416710461
          path: artifacts

      - name: Compare database-pretrained model with published model
        run: |
          python scripts/compare_candidates.py --candidate artifacts/models/candidates/book-pretrained.npz --champion models/connect4_ntuple.npz --games 500 --depth 2 --seed 810000 --output comparison-pretrained.json

      - name: Compare self-play model with published model
        run: |
          python scripts/compare_candidates.py --candidate artifacts/models/candidates/latest.npz --champion models/connect4_ntuple.npz --games 500 --depth 2 --seed 910000 --output comparison-selfplay.json

      - name: Save comparison reports
        uses: actions/upload-artifact@v4
        with:
          name: connect-four-book-model-comparison
          path: |
            comparison-pretrained.json
            comparison-selfplay.json
          if-no-files-found: error
          retention-days: 90
