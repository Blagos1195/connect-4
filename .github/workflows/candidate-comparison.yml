name: Compare Connect Four Book Model

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: Completed training run ID (leave blank for the automatic comparison)
        required: false
        type: string
  workflow_run:
    workflows: ["Train From Connect Four Solved Opening Book"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download the completed book-training artifact
        uses: actions/download-artifact@v4
        with:
          name: connect-four-book-trained
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.training_run_id || github.event.workflow_run.id }}
          path: artifacts

      - name: Compare the database-trained model with the published model
        run: |
          python scripts/compare_candidates.py --candidate artifacts/models/candidates/book-pretrained.npz --champion models/connect4_ntuple.npz --games 500 --depth 2 --seed 810000 --output comparison-book.json

      - name: Save comparison report
        uses: actions/upload-artifact@v4
        with:
          name: connect-four-book-model-comparison
          path: comparison-book.json
          if-no-files-found: error
          retention-days: 90
